# Container-runtime dependency file for Streamlit in Snowflake (the primary path).
# Container runtime resolves these from PyPI at build time via a PyPI External
# Access Integration (EAI). Because PyPI carries every version, ">=" floors are
# safe here (unlike the Anaconda channel used by the warehouse fallback, where
# available versions differ per Python runtime - see environment.yml).
#
# Every package the app imports is declared so nothing is assumed pre-installed.
# matplotlib is REQUIRED: the Consumption heatmap uses pandas
# Styler.background_gradient(), which imports matplotlib at runtime.
#
# Container runtime is Python 3.11 and requires streamlit >= 1.50.
# requires-python floor is 3.9 so the same file also works for local dev and the
# warehouse fallback (Python 3.9/3.10/3.11).
[project]
name = "provider-telemetry-dashboard"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.50.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "snowflake-snowpark-python>=1.11.0",
    "snowflake-connector-python>=3.3.0",
]
