# Opt SPEC: builtin AI function via inline query_text, body-mode GEPA,
# contains_match, NO holdout_data, ultra-light budget.
function:
  query_text: "AI_COMPLETE('llama3.1-8b', 'Reply with positive or negative for: ' || TEXT)"
metrics:
  - name: contains_match
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
optimization:
  models:
    - llama3.1-8b
  reflection_model: claude-sonnet-4-5
  budget: ultra-light
