#
# Opt SPEC: user function, body-mode GEPA, fuzzy_match, NO holdout_data (no
# final test evaluation), ultra-light budget. optimize_mode omitted -> defaults
# to body.
function:
  function_name: __FUNCTION__
metrics:
  - name: fuzzy_match
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
optimization:
  models:
    - llama3.1-8b
  reflection_model: claude-sonnet-4-5
  budget: ultra-light
