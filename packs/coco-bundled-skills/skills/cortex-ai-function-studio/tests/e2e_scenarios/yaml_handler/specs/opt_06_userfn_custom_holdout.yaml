#
# Opt SPEC: user function, body-mode GEPA, custom metric backed by a user UDF
# (metric_name=custom, custom_udf points at the provisioned scorer), WITH
# holdout, ultra-light budget.
function:
  function_name: __FUNCTION__
metrics:
  - name: custom
    custom_udf: __METRIC_UDF__
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
  holdout_data: __TABLE__
optimization:
  models:
    - llama3.1-8b
  reflection_model: claude-sonnet-4-5
  budget: ultra-light
  optimize_mode: body
