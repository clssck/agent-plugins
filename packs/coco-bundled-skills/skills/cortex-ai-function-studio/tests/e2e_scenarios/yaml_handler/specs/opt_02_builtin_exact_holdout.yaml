# Opt SPEC: builtin AI function via inline query_text (must be a single
# AI_COMPLETE for optimization), body-mode GEPA, exact_match, WITH holdout_data,
# ultra-light budget. Seeds the candidate program from the query_text.
function:
  query_text: "AI_COMPLETE('llama3.1-8b', 'Classify sentiment as positive or negative: ' || TEXT)"
metrics:
  - name: exact_match
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
  holdout_data: __TABLE__
optimization:
  models:
    - llama3.1-8b
  reflection_model: claude-sonnet-4-5
  budget: ultra-light
  optimize_mode: body
