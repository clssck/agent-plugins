# Strict mypy config enforced on commits (pre-commit hook) and in CI (caifs-lint).
# To promote a setting to the base config: add it to pyproject.toml [tool.mypy] and remove it here.

[mypy]
files = handlers, scripts, packages
python_version = 3.12
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
exclude = (?x)(openevolve|/tests/)
explicit_package_bases = True
mypy_path = packages/snowflake-ai-optimize-bench/src:packages/snowflake-ai-optimize-core/src:packages/snowflake-ai-optimize-evolve/src:packages/snowflake-ai-optimize-gepa/src:packages/snowflake-ai-optimize-gepa-dev/src:packages/snowflake-ai-optimize-synthetic/src
