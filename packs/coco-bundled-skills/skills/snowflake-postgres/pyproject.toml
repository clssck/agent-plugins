[project]
name = "snowflake-postgres"
version = "0.1.0"
description = "Snowflake Postgres skill for Cortex Code"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.9; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "snowflake-connector-python>=3.11.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "tabulate>=0.9.0",
    "pg8000>=1.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/shared", "migrate/scripts"]
markers = [
    "live: marks tests as requiring live Snowflake + Postgres connections (skipped unless --live is passed)",
]
