    type: streamlit
    identifier:
      name: DASHBOARD_COMPUTE_SNOWFLAKE
      database: <FROM_CONNECTION>   # Use: snow connection list
      schema: <FROM_CONNECTION>
    query_warehouse: <FROM_CONNECTION>
    runtime_name: SYSTEM$ST_CONTAINER_RUNTIME_PY3_11
    # Resolve before deploy: SHOW PARAMETERS LIKE 'DEFAULT_STREAMLIT_COMPUTE_POOL' IN ACCOUNT;
    # validate with SHOW COMPUTE POOLS (see references/snowflake-deployment.md Step 3)
    compute_pool: <FROM_ACCOUNT_DEFAULT>
    # List available: SHOW EXTERNAL ACCESS INTEGRATIONS;
    # Common: PYPI_ACCESS_INTEGRATION (verify exists)
    external_access_integrations:
      - <YOUR_PYPI_INTEGRATION>
    main_file: streamlit_app.py
    artifacts:
      - streamlit_app.py
      - pyproject.toml
