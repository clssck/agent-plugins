# Opt SPEC: user function, body-mode GEPA optimizing across TWO models
# (cross-model run; SEED per_model_stats aggregates both), exact_match, WITH
# holdout, ultra-light budget.
function:
  function_name: __FUNCTION__
metrics:
  - name: exact_match
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
  holdout_data: __TABLE__
optimization:
  models:
    - llama3.1-8b
    - mistral-7b
  reflection_model: claude-sonnet-4-5
  budget: ultra-light
  optimize_mode: body
