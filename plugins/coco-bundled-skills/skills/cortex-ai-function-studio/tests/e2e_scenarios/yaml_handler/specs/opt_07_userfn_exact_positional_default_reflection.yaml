#
# Opt SPEC: user function, body-mode GEPA, exact_match, POSITIONAL ($1)
# argument_mapping, NO holdout, and reflection_model OMITTED so the handler's
# default reflection model is exercised. ultra-light budget.
function:
  function_name: __FUNCTION__
metrics:
  - name: exact_match
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      $1: TEXT
    ground_truth: EXPECTED_LABEL
optimization:
  models:
    - llama3.1-8b
  budget: ultra-light
