# Eval SPEC: user function, exact_match, named argument_mapping, metrics as a
# single mapping (not a list), num_eval_runs: 2 -> EVAL_1, EVAL_2.
function:
  function_name: __FUNCTION__
metrics:
  name: exact_match
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
evaluation:
  num_eval_runs: 2
