# Eval SPEC: user function, fuzzy_match, positional ($1) argument_mapping,
# metrics as a list, single run.
function:
  function_name: __FUNCTION__
metrics:
  - name: fuzzy_match
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      $1: TEXT
    ground_truth: EXPECTED_LABEL
evaluation:
  num_eval_runs: 1
