# Opt SPEC: user function, body-mode GEPA, llm-judge metric (normalizes to
# metric_name=llm_judge on the SEED run; judge_model kept cheap), WITH holdout,
# ultra-light budget.
function:
  function_name: __FUNCTION__
metrics:
  - name: llm-judge
    judge_model: llama3.1-8b
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
  holdout_data: __TABLE__
optimization:
  models:
    - llama3.1-8b
  reflection_model: claude-sonnet-4-5
  budget: ultra-light
  optimize_mode: body
