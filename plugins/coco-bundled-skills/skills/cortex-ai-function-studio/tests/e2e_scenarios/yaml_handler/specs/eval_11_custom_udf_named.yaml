# Eval SPEC: user function, custom metric backed by a user UDF (metric_name
# normalizes to 'custom', custom_udf points at the provisioned scorer), named
# argument_mapping, single run.
function:
  function_name: __FUNCTION__
metrics:
  - name: custom
    custom_udf: __METRIC_UDF__
dataset:
  name: __TABLE__
  column_mapping:
    argument_mapping:
      TEXT: TEXT
    ground_truth: EXPECTED_LABEL
evaluation:
  num_eval_runs: 1
