job_kind: optimization
result:
  best_score_present: true
  experiment: __EXP__
  status: SUCCEEDED
runs:
  SEED:
    count: 1
    metric_keys:
    - estimated_cost
    - valset_score
    param_keys:
    - experiment_schema_version
    - function_impl
    - function_name
    - global_iteration
    - is_full_eval
    - iteration
    - metric_name
    - model
    - per_model_stats
    - run_type
    - status
    - total_candidates
    params:
      experiment_schema_version: '4'
      function_name: __FUNCTION__
      is_full_eval: 'true'
      iteration: '0'
      metric_name: fuzzy_match
      model: llama3.1-8b
      run_type: seed
      status: completed
    run_types:
    - seed
    statuses:
    - FINISHED
