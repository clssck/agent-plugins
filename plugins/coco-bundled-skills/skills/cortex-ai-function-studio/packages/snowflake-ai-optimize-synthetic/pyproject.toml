[project]
name = "snowflake-ai-optimize-synthetic"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "snowflake-ai-optimize-core",
]

[tool.uv.sources]
snowflake-ai-optimize-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowflake_ai_optimize"]
