      - name: QUERY_HASH
        synonyms:
          - query fingerprint
          - query signature
        description: Hash of the query text
        expr: query_hash
        data_type: VARCHAR(16777216)
      - name: QUERY_PARAMETERIZED_HASH
        synonyms:
          - parameterized hash
