  - name: Pruning opportunity, sorted by the potential to avoid partitions — scoped to query set
    question: Which tables in the user-supplied query set have the most opportunity to improve pruning rate?
    sql: SELECT tp.database_name, tp.schema_name, tp.table_name, tp.database_name || '.' || tp.schema_name || '.' || tp.table_name AS fully_qualified_table, tp.table_id, SUM(tp.num_queries) AS query_count, SUM(tp.partitions_scanned) AS total_partitions_scanned, SUM(tp.partitions_pruned) AS total_partitions_pruned, sum(tp.rows_matched) as total_rows_matched, sum(tp.rows_pruned) as total_rows_pruned, sum(tp.rows_scanned) as total_rows_scanned, ROUND(CASE WHEN (SUM(tp.partitions_scanned) + SUM(tp.partitions_pruned)) > 0 THEN (CAST(SUM(tp.partitions_pruned) AS FLOAT) / NULLIF((SUM(tp.partitions_scanned) + SUM(tp.partitions_pruned)), 0)) * 100 ELSE 0 END, 2) AS partition_unused_percentage, ROUND((CASE WHEN (sum(rows_pruned) + sum(rows_scanned)) > 0 THEN 100 - (sum(rows_matched)::FLOAT / (sum(rows_pruned) + sum(rows_scanned))) * 100 ELSE 0 END), 2) AS row_unused_percentage, sum(rows_scanned) - sum(rows_matched) as excess_rows_scanned, avg(tp.rows_scanned - tp.rows_matched) as avg_excess_rows_scanned, ROUND(CASE WHEN (SUM(tp.partitions_scanned) + SUM(tp.partitions_pruned)) > 0 and (SUM(tp.rows_pruned) + SUM(tp.rows_scanned)) > 0 then(avg(tp.rows_scanned - tp.rows_matched) / ((sum(tp.rows_scanned) + sum(tp.rows_pruned)) / (sum(tp.partitions_scanned) + sum(tp.partitions_pruned)))) ELSE 0 END, 2) as avg_potential_avoidable_partitions FROM SNOWFLAKE.ACCOUNT_USAGE.TABLE_QUERY_PRUNING_HISTORY AS tp WHERE tp.interval_start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND DATEADD('hour', 4, '<SCOPE_END>'::TIMESTAMP_LTZ) AND tp.query_parameterized_hash IN (<HASH_LIST>) GROUP BY tp.database_name, tp.schema_name, tp.table_name, tp.table_id ORDER BY avg_potential_avoidable_partitions desc limit 20
