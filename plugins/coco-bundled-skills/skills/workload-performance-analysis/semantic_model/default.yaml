custom_instructions: |
  CRITICAL RULES FOR CONSISTENT RESULTS:
  
  [MANDATORY] WAREHOUSE_NAME AND WAREHOUSE_SIZE MUST ALWAYS APPEAR TOGETHER:
  - Whenever warehouse_name is in SELECT, warehouse_size MUST also be in SELECT
  - Whenever warehouse_name is in GROUP BY, warehouse_size MUST also be in GROUP BY
  - This rule has NO exceptions. Never include warehouse_name without warehouse_size.
  
  1. NO ARBITRARY THRESHOLDS: Never add HAVING clauses with thresholds (like spilling > 1GB, cache_hit_pct < 50%) unless the user explicitly requests a filter. Return all relevant data and let the user interpret.
  
  2. QUERY-LEVEL RESULTS - REQUIRED FIELDS: For ANY analysis that returns individual queries (slowest queries, spilling queries, pruning queries, QAS eligible queries, etc.), ALWAYS include these columns:
     - query_id
     - warehouse_name
     - warehouse_size
     - start_time
     - ROUND(execution_time / 1000.0, 2) AS execution_seconds
     - user_name
     - LEFT(query_text, 100) AS query_preview
  
  3. WAREHOUSE RESULTS - REQUIRED FIELDS: For ANY analysis involving warehouses (individual warehouse details, warehouse comparisons, grouped by warehouse), ALWAYS include:
     - warehouse_name
     - warehouse_size
     This applies to: cache hit rates, spilling analysis, QAS eligibility, query counts by warehouse, or any question mentioning a specific warehouse.
  
  4. TABLE/COLUMN-LEVEL RESULTS - REQUIRED FIELDS: For column or table analysis, ALWAYS include:
     - database_name || '.' || schema_name || '.' || table_name AS fully_qualified_table
  
  5. USE ILIKE FOR NAME FILTERING: When filtering by warehouse_name, table_name, user_name, etc., use ILIKE instead of = for case-insensitive matching.
  
  6. USE COALESCE FOR AGGREGATIONS: Always use COALESCE or ZEROIFNULL for spilling and other nullable columns: SUM(COALESCE(bytes_spilled_to_local_storage, 0)).
  
  7. DEFAULT TIME RANGE: Use 7 days as the default unless user specifies otherwise.
  
  8. HUMAN-READABLE UNITS: Convert bytes to GB (bytes / 1024 / 1024 / 1024), milliseconds to seconds (ms / 1000).
  
  DATA SOURCES:
  - QUERY_HISTORY: Query execution metrics including spilling, local disk cache hit rate (percentage_scanned_from_cache), execution time, partitions_scanned/partitions_total for query-level pruning analysis
  - QUERY_ACCELERATION_ELIGIBLE: Queries that could benefit from QAS (has query_id, query_text, warehouse_name, warehouse_size)
  - TABLE_QUERY_PRUNING_HISTORY: Table-level pruning statistics (aggregated over intervals, NO query_id or warehouse info)
  - COLUMN_QUERY_PRUNING_HISTORY: Column-level pruning and search optimization candidates (aggregated over intervals, NO query_id or warehouse info)
  
  CACHE HIT RATE CALCULATION (LOCAL DISK CACHE):
  - percentage_scanned_from_cache measures the LOCAL DISK CACHE (also called warehouse cache) — the SSD/memory cache on compute nodes. It does NOT measure the query result cache or metadata cache.
  - USE the column percentage_scanned_from_cache from QUERY_HISTORY - this is the correct local disk cache hit rate
  - DO NOT calculate cache hit rate manually from bytes_scanned - use the existing column
  - Formula: AVG(percentage_scanned_from_cache) for warehouse-level local disk cache hit rates
  - Terminology: Mirror the user's term. If the user says "local disk cache", use that. If "warehouse cache", use that. Both refer to the same cache.
  
  PRUNING ANALYSIS DATA SOURCE:
  - For "queries with worst pruning" or any query-level pruning analysis: Use QUERY_HISTORY (has query_id, warehouse_name, warehouse_size, partitions_scanned, partitions_total)
  - For "tables with worst pruning" or table-level analysis: Use TABLE_QUERY_PRUNING_HISTORY (aggregated, no individual query details)
  
  SPILLING ANALYSIS: 
  - Causes: Warehouse too small, high concurrency, complex joins/aggregations
  - bytes_spilled_to_local_storage = warehouse may be undersized
  - bytes_spilled_to_remote_storage = severe memory pressure
  - Suggestions: Increase warehouse size, reduce concurrent queries, schedule heavy queries off-peak
  
  POOR PRUNING:
  - Causes: Missing/ineffective clustering keys, queries not filtering on clustered columns
  - Suggestions: Add clustering on frequently filtered columns, consider search optimization for point lookups
  
  LOW CACHE HIT:
  - Causes: Irregular query patterns, frequently changing data, insufficient query repetition
  - Suggestions: Consolidate similar queries, increase query frequency on stable data
  
  QAS ELIGIBLE:
  - Causes: Queries with selective filters on large tables benefit from parallel processing
  - Suggestions: Enable QAS with ALTER WAREHOUSE <name> SET ENABLE_QUERY_ACCELERATION = TRUE
  
  SEARCH OPTIMIZATION: Columns with search_optimization_supported_expressions are candidates. Best for point lookups and equality predicates on high-cardinality columns.
  
  CLUSTERING KEY CANDIDATES: Identify by analyzing columns with high avg_potential_avoidable_partitions and frequent use (num_queries).
  
  AGGREGATION NOTE: TABLE_QUERY_PRUNING_HISTORY and COLUMN_QUERY_PRUNING_HISTORY contain aggregated data over intervals, not individual query records. Use interval_start_time for time filtering. num_queries shows how many queries contributed to each record.
  
  STORED PROCEDURE ANALYSIS:
  - A stored procedure execution is identified by query_type = 'CALL'.
  - Linking children: ACCOUNT_USAGE.QUERY_HISTORY has no parent_job_id. Children are linked to a CALL by session_id = parent.session_id AND start_time BETWEEN parent.start_time AND parent.end_time AND query_id <> parent.query_id. May include unrelated session activity (rare, since procedures typically run in their own session).
  - Tree construction uses a non-recursive approach: one flat scan over the parent's session window into a _call_tree_candidates CTE, then a parent_link CTE that assigns each non-root candidate its direct parent via MIN_BY(parent.query_id, DATEDIFF('millisecond', parent.start_time, parent.end_time)) — i.e. the CALL ancestor with the minimum-width strictly-containing interval. A strict-containment guard (parent.start_time < child.start_time OR parent.end_time > child.end_time) breaks mutual containment on equal-window siblings. Depth is derived from a fixed 5-hop LEFT JOIN walk on the parent chain (depths beyond 5 are reported as 5). The tree result is hard-capped at 500 rows ordered by start_time. This avoids the recursive-CTE blowup on long-running procedures.
  - **HARD LIMIT: 500 rows.** The "Find stored procedure call tree" verified query is hard-capped at LIMIT 500. If the procedure has more than 500 descendants in its session window, the result is truncated to the earliest 500 by start_time. Callers (stored-procedure/summary/SKILL.md) MUST surface this truncation explicitly to the user — for example: "Result truncated to 500 rows; X total descendants exist. Want me to show only top-level CALLs, or filter by query_type?"
  - "Other" time (overhead not exposed in ACCOUNT_USAGE) is total_elapsed_time minus the 7 exposed duration columns. A high other_time ratio (> 30%) usually points to GS/scheduling overhead or many small metadata operations.
  - 45-min ACCOUNT_USAGE latency / 365-day retention. If the parent CALL is not found in the default 7-day window, ask the user to expand to 14/30/90 days before giving up.
  - For deeper bottleneck analysis (spilling, pruning, cache, QAS) on the procedure body, delegate to the relevant scoped sub-skills with the leaf children's query_id list (exclude is_call=true rows). Do not re-implement scoped dimension queries inside stored-procedure/.
  - WAREHOUSE_NAME + WAREHOUSE_SIZE pairing rule applies: every SELECT and GROUP BY that includes warehouse_name must also include warehouse_size.
  
  QUERY SET SCOPING (for the QUERY_SET entity):
  - Accept exactly one of three input forms: (a) explicit list of 2–1000 query_ids, (b) SQL WHERE fragment over QUERY_HISTORY with a time bound, (c) list of query_parameterized_hash values with a time bound. Reject input forms outside this set.
  - HARD CAP: 1000 query_ids. Filter-form and hash-form resolution queries use ORDER BY start_time DESC LIMIT 1000. If more than 1000 ids resolve, the set is truncated to the most recent 1000 — callers MUST surface this in the scope card.
  - Filter form requires a time bound. If the user does not supply one, default to start_time >= DATEADD('day', -7, CURRENT_DATE()) and disclose that choice in the scope card.
  - Hash form requires a time bound — never query QUERY_HISTORY by hash alone (would scan all of retention).
  - Filter validation: reject WHERE fragments that contain semicolons, DDL/DML keywords (CREATE, ALTER, DROP, INSERT, UPDATE, DELETE, MERGE, TRUNCATE, COPY), subqueries against tables other than QUERY_HISTORY, or UNION/JOIN clauses. Ask the user to resubmit a simpler predicate.
  - Always present the scope card and STOP for confirmation before running any scoped dimensional query. The scope card MUST list query_count, pattern_count, time window, distinct warehouses (with sizes), users, query_types breakdown, failure_count, and total elapsed roll-up.
  - When delegating to scoped dimension queries (spilling/pruning/cache/qas), use the verified queries named "<base name> — scoped to query set". Each scoped variant accepts <ID_LIST>, <HASH_LIST>, <SCOPE_START>, <SCOPE_END> placeholders.
  - QUERY_HISTORY-based scoped queries: filter on `query_id IN (<ID_LIST>) AND start_time BETWEEN <SCOPE_START> AND <SCOPE_END>`. The 1000-id cap from resolution applies to all input forms (filter, hash, explicit list); scoped variants do NOT widen beyond the resolved id list. The earlier OR-with-<HASH_LIST> design was removed because it contaminated id-form sets with unrelated executions of the same pattern.
  - **Filter-form security:** `<USER_FILTER>` validation is best-effort string matching by the LLM, not robust SQL parsing. Bypass via `1=1`, scalar UDFs, `query_text ILIKE '%…%'` exfiltration, or non-deterministic predicates is possible. Run QUERY_SET filter form under a least-privileged role. Future hardening will use `EXPLAIN`-based validation.
  - The `Resolve query set from filter` verified query is **unclamped**; the skill (`query-set/summary/SKILL.md` Step 1(b)) is responsible for prepending a default `start_time >= DATEADD('day', -7, CURRENT_DATE())` when `<USER_FILTER>` lacks a time predicate, and disclosing that default in the scope card.
  - PRUNING-based scoped queries (TABLE_QUERY_PRUNING_HISTORY / COLUMN_QUERY_PRUNING_HISTORY) lack query_id. Filter on query_parameterized_hash IN (<HASH_LIST>) AND interval_start_time BETWEEN scope window.
  - QAS-based scoped queries (QUERY_ACCELERATION_ELIGIBLE) match on query_id IN (<ID_LIST>) only — QAS_ELIGIBLE has query_id but no parameterized_hash semantic.
  - WAREHOUSE_NAME + WAREHOUSE_SIZE pairing rule applies to every scoped query.
  - Internal warehouses (COMPUTE_SERVICE_WH_*) appearing in a scoped result are still flagged as internal — they remain not user-configurable.
