  # ------------------------------------------------------------------
  # STORED PROCEDURE analysis. Used by stored-procedure/{summary,detection,recommendation}.
  # Placeholders (caller must substitute ALL):
  #   <QUERY_ID>           parent CALL query_id (UUID)
  #   <DAYS>               look-back window for the parent search (default 7)
  #   <PARENT_QUERY_ID>    same as <QUERY_ID>
  #   <PARENT_SESSION_ID>  parent.session_id captured from Step 1
  #   <PARENT_START_TIME>  parent.start_time TIMESTAMP_LTZ literal
  #   <PARENT_END_TIME>    parent.end_time TIMESTAMP_LTZ literal
  # NOTE: The call tree query uses a flat session-window scan + containment self-join
  # (NOT a recursive CTE) and is hard-capped with LIMIT 500. If the procedure has more
  # than 500 descendants, results are truncated to the earliest 500 by start_time —
  # callers MUST surface this truncation to the user.
  # ------------------------------------------------------------------
  - name: Find stored procedure parent CALL
    question: Locate the parent CALL row for a stored procedure execution and capture session/time/warehouse context.
    sql: SELECT query_id, query_text, query_type, query_parameterized_hash, session_id, start_time, end_time, total_elapsed_time, compilation_time, execution_time, queued_overload_time, queued_provisioning_time, queued_repair_time, transaction_blocked_time, list_external_files_time, GREATEST(total_elapsed_time - COALESCE(compilation_time, 0) - COALESCE(execution_time, 0) - COALESCE(queued_overload_time, 0) - COALESCE(queued_provisioning_time, 0) - COALESCE(queued_repair_time, 0) - COALESCE(transaction_blocked_time, 0) - COALESCE(list_external_files_time, 0), 0) AS other_time_ms, warehouse_name, warehouse_size, user_name, role_name, execution_status, error_code, error_message, LEFT(query_text, 200) AS query_preview FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE query_id = '<QUERY_ID>' AND start_time >= DATEADD('day', -<DAYS>, CURRENT_DATE()) ORDER BY start_time DESC LIMIT 1
    verified_at: 1727654400
    verified_by: System

  - name: Find stored procedure call tree
    question: Build the parent + descendant call tree for a stored procedure using a flat session-window scan plus a min-width-strictly-containing parent link (NOT a recursive CTE). Depth derived from a fixed 5-hop walk on the parent chain; depths beyond 5 are reported as 5. Tree result hard-capped at LIMIT 500 by start_time.
    sql: WITH _call_tree_candidates AS (SELECT query_id, query_type, (query_type = 'CALL') AS is_call, session_id, start_time, end_time, total_elapsed_time, compilation_time, execution_time, queued_overload_time, queued_provisioning_time, queued_repair_time, transaction_blocked_time, list_external_files_time, GREATEST(total_elapsed_time - COALESCE(compilation_time, 0) - COALESCE(execution_time, 0) - COALESCE(queued_overload_time, 0) - COALESCE(queued_provisioning_time, 0) - COALESCE(queued_repair_time, 0) - COALESCE(transaction_blocked_time, 0) - COALESCE(list_external_files_time, 0), 0) AS other_time_ms, execution_status, error_code, error_message, bytes_scanned, rows_produced, partitions_scanned, partitions_total, warehouse_name, warehouse_size, LEFT(query_text, 200) AS query_preview FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE session_id = <PARENT_SESSION_ID> AND start_time BETWEEN '<PARENT_START_TIME>'::TIMESTAMP_LTZ AND '<PARENT_END_TIME>'::TIMESTAMP_LTZ), parent_link AS (SELECT child.query_id, MIN_BY(parent.query_id, DATEDIFF('millisecond', parent.start_time, parent.end_time)) AS direct_parent_id FROM _call_tree_candidates child JOIN _call_tree_candidates parent ON parent.is_call = TRUE AND parent.start_time <= child.start_time AND parent.end_time >= child.end_time AND parent.query_id <> child.query_id AND (parent.start_time < child.start_time OR parent.end_time > child.end_time) WHERE child.query_id <> '<PARENT_QUERY_ID>' GROUP BY child.query_id), depth_walk AS (SELECT pl1.query_id, pl1.direct_parent_id, CASE WHEN pl5.query_id IS NOT NULL THEN 5 WHEN pl4.query_id IS NOT NULL THEN 4 WHEN pl3.query_id IS NOT NULL THEN 3 WHEN pl2.query_id IS NOT NULL THEN 2 ELSE 1 END AS depth FROM parent_link pl1 LEFT JOIN parent_link pl2 ON pl2.query_id = pl1.direct_parent_id LEFT JOIN parent_link pl3 ON pl3.query_id = pl2.direct_parent_id LEFT JOIN parent_link pl4 ON pl4.query_id = pl3.direct_parent_id LEFT JOIN parent_link pl5 ON pl5.query_id = pl4.direct_parent_id) SELECT CASE WHEN c.query_id = '<PARENT_QUERY_ID>' THEN 0 ELSE dw.depth END AS depth, dw.direct_parent_id AS parent_query_id, c.query_id, c.query_type, c.is_call, c.session_id, c.start_time, c.end_time, c.total_elapsed_time, c.compilation_time, c.execution_time, c.queued_overload_time, c.queued_provisioning_time, c.queued_repair_time, c.transaction_blocked_time, c.list_external_files_time, c.other_time_ms, c.execution_status, c.error_code, c.error_message, c.bytes_scanned, c.rows_produced, c.partitions_scanned, c.partitions_total, c.warehouse_name, c.warehouse_size, c.query_preview, FALSE AS at_depth_cap FROM _call_tree_candidates c LEFT JOIN depth_walk dw ON dw.query_id = c.query_id WHERE c.query_id = '<PARENT_QUERY_ID>' OR dw.query_id IS NOT NULL ORDER BY c.start_time LIMIT 500
    verified_at: 1727654400
    verified_by: System

  - name: Aggregate stored procedure children by query type
    question: Aggregate the descendants of a stored procedure by query_type. Uses the same containment-derived descendant set as the call tree (filters on the descendant set, not the raw session window).
    sql: WITH _call_tree_candidates AS (SELECT query_id, query_type, (query_type = 'CALL') AS is_call, start_time, end_time, total_elapsed_time, compilation_time, execution_time, queued_overload_time, queued_provisioning_time, queued_repair_time, transaction_blocked_time FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE session_id = <PARENT_SESSION_ID> AND start_time BETWEEN '<PARENT_START_TIME>'::TIMESTAMP_LTZ AND '<PARENT_END_TIME>'::TIMESTAMP_LTZ), _descendants AS (SELECT c.* FROM _call_tree_candidates c WHERE c.query_id <> '<PARENT_QUERY_ID>' AND EXISTS (SELECT 1 FROM _call_tree_candidates parent WHERE parent.is_call = TRUE AND parent.start_time <= c.start_time AND parent.end_time >= c.end_time AND parent.query_id <> c.query_id)) SELECT query_type, COUNT(*) AS query_count, SUM(total_elapsed_time) AS total_elapsed_ms, SUM(compilation_time) AS total_compile_ms, SUM(execution_time) AS total_execute_ms, SUM(COALESCE(queued_overload_time, 0) + COALESCE(queued_provisioning_time, 0) + COALESCE(queued_repair_time, 0)) AS total_queue_ms, SUM(transaction_blocked_time) AS total_blocked_ms, ROUND(100.0 * SUM(total_elapsed_time) / NULLIF(SUM(SUM(total_elapsed_time)) OVER (), 0), 2) AS pct_of_total FROM _descendants GROUP BY query_type ORDER BY total_elapsed_ms DESC
    verified_at: 1727654400
    verified_by: System

  - name: Aggregate stored procedure descendants (uncapped totals)
    question: Compute uncapped duration/failure totals across all descendants of a stored procedure, scoped via the same containment-derived descendant set as the call tree. Drives Phase 1 duration breakdown and Phase 2 profile classification (NOT the 500-row tree result).
    sql: WITH _call_tree_candidates AS (SELECT query_id, query_type, (query_type = 'CALL') AS is_call, start_time, end_time, total_elapsed_time, compilation_time, execution_time, queued_overload_time, queued_provisioning_time, queued_repair_time, transaction_blocked_time, list_external_files_time, execution_status FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE session_id = <PARENT_SESSION_ID> AND start_time BETWEEN '<PARENT_START_TIME>'::TIMESTAMP_LTZ AND '<PARENT_END_TIME>'::TIMESTAMP_LTZ), _descendants AS (SELECT c.* FROM _call_tree_candidates c WHERE c.query_id <> '<PARENT_QUERY_ID>' AND EXISTS (SELECT 1 FROM _call_tree_candidates parent WHERE parent.is_call = TRUE AND parent.start_time <= c.start_time AND parent.end_time >= c.end_time AND parent.query_id <> c.query_id)) SELECT COUNT(*) AS descendant_count, COUNT_IF(execution_status = 'FAIL') AS failure_count, SUM(total_elapsed_time) AS total_elapsed_ms, SUM(compilation_time) AS total_compile_ms, SUM(execution_time) AS total_execute_ms, SUM(COALESCE(queued_overload_time, 0) + COALESCE(queued_provisioning_time, 0) + COALESCE(queued_repair_time, 0)) AS total_queue_ms, SUM(transaction_blocked_time) AS total_blocked_ms, SUM(list_external_files_time) AS total_external_ms, SUM(GREATEST(total_elapsed_time - COALESCE(compilation_time, 0) - COALESCE(execution_time, 0) - COALESCE(queued_overload_time, 0) - COALESCE(queued_provisioning_time, 0) - COALESCE(queued_repair_time, 0) - COALESCE(transaction_blocked_time, 0) - COALESCE(list_external_files_time, 0), 0)) AS total_other_ms FROM _descendants
    verified_at: 1727654400
    verified_by: System

  # ------------------------------------------------------------------
  # QUERY SET resolution and scoped dimensional variants. Used by
  # query-set/{summary,detection,recommendation} sub-skills and by the
  # scope-aware mode of spilling/pruning/cache/qas detection sub-skills.
  # Placeholders (caller must substitute ALL):
  #   <ID_LIST>        comma-separated quoted query_id values
  #   <HASH_LIST>      comma-separated quoted query_parameterized_hash values
  #   <USER_FILTER>    SQL WHERE fragment over QUERY_HISTORY (no leading AND, no semicolons, no DDL/DML)
  #   <SCOPE_START>    TIMESTAMP_LTZ literal (lower bound)
  #   <SCOPE_END>      TIMESTAMP_LTZ literal (upper bound)
  #   <TABLE_ID_LIST>  comma-separated table_id values (optional; pruning queries)
  # Hard cap: 1000 query_ids in the resolved set.
  # ------------------------------------------------------------------
  - name: Resolve query set from filter
    question: Resolve a user-supplied SQL WHERE fragment over QUERY_HISTORY into a query_id list (capped at 1000 by start_time DESC). Caller is responsible for ensuring <USER_FILTER> contains a time bound — see query-set/summary/SKILL.md Step 1(b).
    sql: SELECT query_id, query_parameterized_hash, warehouse_name, warehouse_size, user_name, query_type, execution_status, start_time, end_time, total_elapsed_time, compilation_time, execution_time, queued_overload_time, queued_provisioning_time, queued_repair_time, transaction_blocked_time, list_external_files_time, bytes_scanned, percentage_scanned_from_cache, partitions_scanned, partitions_total, bytes_spilled_to_local_storage, bytes_spilled_to_remote_storage, error_code, LEFT(query_text, 200) AS query_preview FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE (<USER_FILTER>) ORDER BY start_time DESC LIMIT 1000
    verified_at: 1727654400
