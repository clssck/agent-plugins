  - name: Resolve query set from pattern hashes
    question: Resolve a list of query_parameterized_hash values into a query_id list within a time window (capped at 1000 by start_time DESC).
    sql: SELECT query_id, query_parameterized_hash, warehouse_name, warehouse_size, user_name, query_type, execution_status, start_time, end_time, total_elapsed_time, compilation_time, execution_time, queued_overload_time, queued_provisioning_time, queued_repair_time, transaction_blocked_time, list_external_files_time, bytes_scanned, percentage_scanned_from_cache, partitions_scanned, partitions_total, bytes_spilled_to_local_storage, bytes_spilled_to_remote_storage, error_code, LEFT(query_text, 200) AS query_preview FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE query_parameterized_hash IN (<HASH_LIST>) AND start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND '<SCOPE_END>'::TIMESTAMP_LTZ ORDER BY start_time DESC LIMIT 1000
