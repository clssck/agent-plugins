        description: "Type of insight (e.g., QUERY_INSIGHT_EXPLODING_JOIN, QUERY_INSIGHT_NO_FILTER_ON_TOP_OF_TABLE_SCAN, QUERY_INSIGHT_WORKER_DATA_SKEW)"
        expr: insight_type_id
        data_type: VARCHAR(16777216)
      - name: INSIGHT_TOPIC
        synonyms:
          - insight category
          - insight area
        description: "High-level topic of the insight (e.g., JOIN, TABLE_SCAN, AGGREGATION, WAREHOUSE)"
        expr: insight_topic
        data_type: VARCHAR(16777216)
      - name: START_TIME
        synonyms:
          - execution start
