      - query performance insights
      - insight types
      - query optimization insights
    description: Query-level performance insights generated by Snowflake, identifying SQL-level and resource-level optimization opportunities
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: QUERY_INSIGHTS
    dimensions:
      - name: QUERY_ID
        synonyms:
          - query identifier
          - query uuid
        description: Unique identifier for the query that generated the insight
        expr: query_id
