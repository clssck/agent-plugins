    verified_by: System

  - name: Identification of columns that have opportunities to improve pruning rate — scoped to query set
    question: Which columns in the user-supplied query set are most frequently used in predicates with opportunity to improve pruning?
    sql: SELECT cp.database_name, cp.schema_name, cp.table_name, cp.table_id, cp.column_name, cp.COLUMN_ID, SUM(cp.num_queries) AS column_usage_count, ROUND(CASE WHEN (sum(cp.PARTITIONS_PRUNED) + sum(cp.PARTITIONS_SCANNED)) > 0 THEN (CAST(sum(cp.PARTITIONS_PRUNED) AS FLOAT) / (sum(cp.PARTITIONS_PRUNED) + sum(cp.PARTITIONS_SCANNED))) * 100 ELSE 0 END, 2) AS partition_pruning_percentage, ROUND(CASE WHEN (sum(cp.rows_scanned) + sum(cp.rows_pruned)) > 0 THEN 100 - (CAST(sum(cp.rows_matched) AS FLOAT) / (sum(cp.rows_scanned) + sum(cp.rows_pruned))) * 100 ELSE 0 END, 2) AS unused_rows_percentage, sum(cp.rows_scanned) - sum(cp.rows_matched) as excess_rows_scanned, avg(cp.rows_scanned - cp.rows_matched) as avg_excess_rows_scanned, ROUND(CASE WHEN (SUM(cp.partitions_scanned) + SUM(cp.partitions_pruned)) > 0 and (SUM(cp.rows_pruned) + SUM(cp.rows_scanned)) > 0 then(avg(cp.rows_scanned - cp.rows_matched) / ((sum(cp.rows_scanned) + sum(cp.rows_pruned)) / (sum(cp.partitions_scanned) + sum(cp.partitions_pruned)))) ELSE 0 END, 2) as avg_potential_avoidable_partitions FROM SNOWFLAKE.ACCOUNT_USAGE.COLUMN_QUERY_PRUNING_HISTORY AS cp WHERE cp.interval_start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND DATEADD('hour', 4, '<SCOPE_END>'::TIMESTAMP_LTZ) AND cp.query_parameterized_hash IN (<HASH_LIST>) GROUP BY cp.database_name, cp.schema_name, cp.table_name, cp.table_id, cp.column_name, cp.column_id HAVING column_usage_count > 0 ORDER BY avg_potential_avoidable_partitions desc limit 20
    verified_at: 1727654400
    verified_by: System

  - name: Warehouses with bad cache hit rates and significant scan and query volume — scoped to query set
    question: Which warehouses have the worst cache hit rates for the user-supplied query set?
    sql: SELECT warehouse_name, warehouse_size, COUNT(*) AS query_count, ROUND(AVG(percentage_scanned_from_cache), 1) AS avg_cache_hit_pct, ROUND(AVG(execution_time) / 1000.0, 2) AS avg_execution_seconds, ROUND(AVG(bytes_scanned) / 1024 / 1024 / 1024.0, 2) AS avg_gb_scanned FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND '<SCOPE_END>'::TIMESTAMP_LTZ AND warehouse_name IS NOT NULL AND bytes_scanned > 0 AND query_id IN (<ID_LIST>) GROUP BY warehouse_name, warehouse_size HAVING COUNT(*) >= 5 ORDER BY avg_cache_hit_pct ASC LIMIT 20
    verified_at: 1727654400
    verified_by: System

  - name: Which warehouses have the most QAS eligible time? — scoped to query set
    question: Which warehouses have the most QAS eligible time for the user-supplied query set?
    sql: SELECT warehouse_name, warehouse_size, COUNT(*) AS eligible_query_count, ROUND(SUM(eligible_query_acceleration_time), 2) AS total_eligible_seconds, ROUND(AVG(eligible_query_acceleration_time), 2) AS avg_eligible_seconds_per_query, ROUND(AVG(upper_limit_scale_factor), 1) AS avg_scale_factor, MAX(upper_limit_scale_factor) as max_scale_factor FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_ACCELERATION_ELIGIBLE WHERE start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND '<SCOPE_END>'::TIMESTAMP_LTZ AND warehouse_name IS NOT NULL AND query_id IN (<ID_LIST>) GROUP BY warehouse_name, warehouse_size ORDER BY total_eligible_seconds DESC LIMIT 20
    verified_at: 1727654400
    verified_by: System

  - name: Which queries are eligible for query acceleration service? — scoped to query set
    question: Which queries are QAS-eligible within the user-supplied query set?
    sql: SELECT query_id, LEFT(query_text, 100) AS query_preview, warehouse_name, warehouse_size, ROUND(eligible_query_acceleration_time, 2) AS eligible_acceleration_seconds, upper_limit_scale_factor, start_time FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_ACCELERATION_ELIGIBLE WHERE start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND '<SCOPE_END>'::TIMESTAMP_LTZ AND warehouse_name IS NOT NULL AND query_id IN (<ID_LIST>) ORDER BY eligible_query_acceleration_time DESC LIMIT 20
    verified_at: 1727654400
