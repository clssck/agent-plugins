    sql: SELECT qh.query_id, qh.query_type, qh.user_name, qh.warehouse_name, qh.warehouse_size, LEFT(qh.query_text, 100) AS query_preview, ROUND(qh.bytes_spilled_to_local_storage / 1024 / 1024 / 1024.0, 2) AS local_spill_gb, ROUND(qh.bytes_spilled_to_remote_storage / 1024 / 1024 / 1024.0, 2) AS remote_spill_gb, ROUND(qh.execution_time / 1000.0, 2) AS execution_seconds, qh.start_time FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY AS qh WHERE qh.start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND '<SCOPE_END>'::TIMESTAMP_LTZ AND (qh.bytes_spilled_to_local_storage > 0 OR qh.bytes_spilled_to_remote_storage > 0) AND qh.query_id IN (<ID_LIST>) ORDER BY qh.bytes_spilled_to_local_storage + qh.bytes_spilled_to_remote_storage DESC LIMIT 20
