  - name: Derive scope from query set
    question: Aggregate a resolved query set to produce its analysis scope (counts, time window, distinct warehouse name+size pairs, users, query_types breakdown, distinct hashes, full duration roll-up, failure count).
    sql: WITH _set AS (SELECT * FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY WHERE query_id IN (<ID_LIST>) AND start_time BETWEEN '<SCOPE_START>'::TIMESTAMP_LTZ AND '<SCOPE_END>'::TIMESTAMP_LTZ), _wh_pairs AS (SELECT DISTINCT warehouse_name, warehouse_size FROM _set WHERE warehouse_name IS NOT NULL), _types AS (SELECT query_type, COUNT(*) AS n FROM _set GROUP BY query_type) SELECT (SELECT COUNT(*) FROM _set) AS query_count, (SELECT COUNT(DISTINCT query_parameterized_hash) FROM _set) AS pattern_count, (SELECT COUNT_IF(execution_status = 'FAIL') FROM _set) AS failure_count, (SELECT MIN(start_time) FROM _set) AS scope_start, (SELECT MAX(COALESCE(end_time, start_time)) FROM _set) AS scope_end, (SELECT ARRAY_AGG(OBJECT_CONSTRUCT('name', warehouse_name, 'size', warehouse_size)) WITHIN GROUP (ORDER BY warehouse_name, warehouse_size) FROM _wh_pairs) AS warehouses, (SELECT ARRAY_AGG(DISTINCT user_name) WITHIN GROUP (ORDER BY user_name) FROM _set) AS users, (SELECT OBJECT_AGG(query_type, n) FROM _types) AS query_types_breakdown, (SELECT ARRAY_AGG(DISTINCT query_parameterized_hash) WITHIN GROUP (ORDER BY query_parameterized_hash) FROM _set) AS hashes, (SELECT SUM(total_elapsed_time) FROM _set) AS total_elapsed_ms, (SELECT SUM(compilation_time) FROM _set) AS total_compile_ms, (SELECT SUM(execution_time) FROM _set) AS total_execute_ms, (SELECT SUM(COALESCE(queued_overload_time,0) + COALESCE(queued_provisioning_time,0) + COALESCE(queued_repair_time,0)) FROM _set) AS total_queue_ms, (SELECT SUM(transaction_blocked_time) FROM _set) AS total_blocked_ms, (SELECT SUM(list_external_files_time) FROM _set) AS total_external_ms, (SELECT SUM(GREATEST(total_elapsed_time - COALESCE(compilation_time,0) - COALESCE(execution_time,0) - COALESCE(queued_overload_time,0) - COALESCE(queued_provisioning_time,0) - COALESCE(queued_repair_time,0) - COALESCE(transaction_blocked_time,0) - COALESCE(list_external_files_time,0), 0)) FROM _set) AS total_other_ms
    verified_at: 1727654400
    verified_by: System

  - name: Derive scope tables from query set
    question: List distinct tables touched by a query set by joining the set's pattern hashes against TABLE_QUERY_PRUNING_HISTORY within the scope time window.
