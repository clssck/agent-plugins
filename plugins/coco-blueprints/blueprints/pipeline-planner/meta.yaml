blueprint_id: blueprint_84a1c3ef
name: Pipeline Planner
summary: Collect pipeline requirements through structured discovery to identify the
  right Snowflake transformation technology
overview: "The Pipeline Planner collects your pipeline requirements through structured\n\
  discovery and produces an answers file \u2014 the contract for downstream tooling.\n\
  \n**What You Will Answer (3-10 questions depending on path):**\n- Whether you're\
  \ extending an existing pipeline or building new\n- If extending with same tech:\
  \ your technology, freshness, and consumers\n- If building new or evaluating alternatives:\
  \ full requirements and technology scoring\n- Your source data reference and transformation\
  \ intent\n\n**Technologies Evaluated:**\n- Dynamic Tables\n- Streams & Tasks\n-\
  \ Snowpark\n- dbt Projects on Snowflake (native)\n- dbt Core (external)\n- dbt +\
  \ Dynamic Tables (combination)\n- Stored Procedures\n\n**Two Entry Paths:**\n- **Expansion**\
  \ \u2014 Extending an existing pipeline with the same technology? Fast-track through\
  \ 3 questions.\n- **Net-New / Evaluate** \u2014 Full requirements discovery and\
  \ technology scoring.\n\n**Output:**\nAn answers file containing all your pipeline\
  \ requirements and technology selection.\nFeed this file to the `pipeline-plan-generator`\
  \ skill to produce an implementation plan.\n"
is_repeatable: true
steps:
- work-context
- project-identification
- approach-decision
- expansion-tech-selection
- expansion-freshness
- expansion-consumers
- source-data-identification
- define-freshness-requirements
- characterize-transformation-logic
- pipeline-trigger-model
- downstream-consumers
- select-constraints
- technology-preference
- technology-recommendation
- source-seed
- define-intent
- pipeline-criticality
