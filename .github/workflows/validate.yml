name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Bun tests
        run: bun test scripts

      - name: Check packs and generated files
        run: bun scripts/sync.ts --check

      - name: Read pinned OMP snapshot
        id: omp
        run: |
          echo "commit=$(bun -e 'console.log((await Bun.file("omp-source-lock.json").json()).snapshotCommit)')" >> "$GITHUB_OUTPUT"
          echo "repository=$(bun -e 'console.log((await Bun.file("omp-source-lock.json").json()).repository)')" >> "$GITHUB_OUTPUT"

      - name: Check out pinned OMP
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.omp.outputs.repository }}
          ref: ${{ steps.omp.outputs.commit }}
          path: oh-my-pi

      - name: Install OMP dependencies
        working-directory: oh-my-pi
        run: bun install --frozen-lockfile --ignore-scripts

      # A workspace checkout loads packages/natives/native/pi_natives.<platform>.node and has no
      # prebuilt addon; take the released one from the leaf package at the workspace's own version.
      - name: Install OMP native addon
        working-directory: oh-my-pi
        run: |
          version=$(bun -e 'console.log((await Bun.file("packages/natives/package.json").json()).version)')
          platform=$(bun -e 'console.log(process.platform + "-" + process.arch)')
          mkdir "$RUNNER_TEMP/natives"
          (cd "$RUNNER_TEMP/natives" && npm pack --silent "@oh-my-pi/pi-natives-${platform}@${version}" && tar -xzf ./*.tgz)
          cp "$RUNNER_TEMP"/natives/package/pi_natives.*.node packages/natives/native/

      # --ignore-scripts skips OMP's prepare hook, which generates this loader dependency.
      - name: Generate OMP tool views
        working-directory: oh-my-pi
        run: bun run gen:tool-views

      - name: Validate packs with OMP's extension loaders
        env:
          OMP_ROOT: ${{ github.workspace }}/oh-my-pi
        run: bun scripts/check-omp-loader.ts
