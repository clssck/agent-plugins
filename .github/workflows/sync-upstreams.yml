name: Sync upstream skills

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packs/**", "sources.json", "scripts/**"]

concurrency:
  group: sync-upstream-pins
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-pin upstreams and regenerate README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync.mjs

      - name: Download upstream skills at the pinned commits
        run: node scripts/fetch.mjs

      - name: Publish
        run: |
          git add -A -- sources.json README.md upstream
          if git diff --cached --quiet; then
            echo "Upstream skills, pins, and README are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update upstream skills"
          git push
