name: Sync upstream pins

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packs/**", "sources.json", "scripts/**"]

concurrency:
  group: sync-upstream-pins
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-pin upstreams and regenerate README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync.mjs

      - name: Verify every pinned upstream builds
        run: node scripts/fetch.mjs

      - name: Publish
        run: |
          if git diff --quiet -- sources.json README.md; then
            echo "Pins and README are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json README.md
          git commit -m "Update upstream pins"
          git push
