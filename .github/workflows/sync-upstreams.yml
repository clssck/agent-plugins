name: Sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packs/**"
      - "sources.json"
      - "scripts/**"
      - ".github/workflows/sync-upstreams.yml"

concurrency:
  group: sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: README "Last updated" for authored packs comes from `git log`.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Pin, fetch, check, and regenerate README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/sync.ts

      # Pushes made with github.token do not trigger Validate, so validate here before committing.
      - name: Bun tests
        run: bun test scripts

      - name: Commit changes
        run: |
          git add -A -- sources.json README.md upstream
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update upstream skills"
          git push
