name: Sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packs/**"
      - "sources.json"
      - "omp-source-lock.json"
      - "upstream-watch.json"
      - "scripts/**"
      - ".github/workflows/sync-upstreams.yml"
      - ".github/actions/**"

# Serialize syncs so publication finishes before the next run starts.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Read-only: pins, fetches, regenerates, and runs every gate. Nothing here can write to the repository.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: README "Last updated" for authored packs comes from `git log`.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Pin, fetch, check, and regenerate README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/sync.ts

      # Pushes made with github.token do not trigger Validate, so run every gate before publication.
      - uses: ./.github/actions/gates

      - name: Collect generated changes
        id: patch
        run: |
          set -euo pipefail
          git add -A -- sources.json README.md upstream
          if git diff --cached --quiet; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary --full-index > "$RUNNER_TEMP/sync.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-patch
          path: ${{ runner.temp }}/sync.patch
          if-no-files-found: error
          retention-days: 1

  # Runs no repository code: publishes only the gated patch, without force-pushing or rebasing untested changes.
  publish:
    needs: sync
    if: github.ref == 'refs/heads/main' && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync-patch
          path: ${{ runner.temp }}/patch

      - name: Publish validated updates to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index --binary "$RUNNER_TEMP/patch/sync.patch"
          git commit -m "chore(sync): update upstream skills"

          git fetch --depth=1 origin refs/heads/main
          # A retry after a successful push has nothing left to publish.
          if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "Main already contains the validated tree."
            exit 0
          fi
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            echo "::error::Main changed during validation; run Sync again against the new main."
            exit 1
          fi
          # A concurrent push after the check is rejected by Git's fast-forward requirement.
          git push origin HEAD:refs/heads/main

  omp-baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Report OMP baseline changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/check-omp-source.ts --notify

  # Vendored upstreams are never synced: a change opens one assigned issue so a maintainer can port it by hand.
  upstream-watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Report vendored upstream changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/check-upstream-watch.ts --notify
