version: 2
updates:
  # Every action reference is pinned to a full commit SHA with a version comment; Dependabot bumps both together.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/gates"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns: ["*"]
